[workspace]
resolver = "3"
members = ["crates/geometry","crates/indexer"]

[workspace.dependencies]
axum = "0.8.9"
tower-http = { version = "0.6.10", features = ["cors"] }
reqwest = { version = "0.13.3", features = ["json", "form", "gzip", "brotli", "deflate"] }
tokio = { version = "1.52.3", features = ["macros"] }
futures = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version =  "4.6.1", features = ["derive"] }
geo = { version = "0.33.1", features = ["serde"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
image = "0.24"